<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="final">

<div id="loader">
  <div class="loader-line"></div>
  <p class="loader-text">Loading</p>
</div>

<nav class="dots" id="navDots" aria-hidden="true"></nav>
<div class="cursor-glow" id="cursorGlow"></div>

<main>
  <section class="scene scene-dark" id="final">
    <div class="hearts" id="heartsField"></div>
    <div class="cake fade-in">
      <svg viewBox="0 0 220 180" width="220" height="180">
        <defs>
          <linearGradient id="cakeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#DCEBFF"/>
            <stop offset="100%" stop-color="#4F8EF7"/>
          </linearGradient>
        </defs>
        <ellipse cx="110" cy="165" rx="95" ry="10" fill="#0B1E45"/>
        <rect x="35" y="95" width="150" height="60" rx="10" fill="url(#cakeGrad)"/>
        <path d="M35 100 q10 -12 20 0 q10 -12 20 0 q10 -12 20 0 q10 -12 20 0 q10 -12 20 0 q10 -12 20 0 q10 -12 10 0 v20 h-150 z" fill="#F5FAFF" opacity="0.85"/>
        <g id="candleGroup"></g>
      </svg>
    </div>
    <h2 class="serif section-title fade-in">Happy Birthday</h2>
    <p class="lede fade-in" id="finalMessage"></p>
    <div class="final-actions">
      <button class="btn" id="againBtn"><span>One more surprise</span><i class="arrow"></i></button>
      <a class="btn nav-link" href="ending.html"><span>Continue</span><i class="arrow"></i></a>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="script.js"></script>
</body>
</html>
