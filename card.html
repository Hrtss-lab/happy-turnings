<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="card">

<div id="loader">
  <div class="loader-line"></div>
  <p class="loader-text">Loading</p>
</div>

<nav class="dots" id="navDots" aria-hidden="true"></nav>
<div class="cursor-glow" id="cursorGlow"></div>

<main>
  <section class="scene" id="card">
    <div class="stars stars-dim"></div>
    <div class="glass-card fade-in">
      <svg class="mark" viewBox="0 0 64 64" width="30" height="30"><path d="M32 12c8-10 24-6 24 6 0 14-24 30-24 30S8 32 8 18c0-12 16-16 24-6z" fill="none" stroke="var(--azure)" stroke-width="2"/></svg>
      <h1 class="serif">Happy Birthday<br><span id="recipientName">Someone</span></h1>
      <p class="lede" id="cardMessage"></p>
      <button class="btn" id="celebrateBtn"><span>Celebrate</span><i class="arrow"></i></button>
      <a class="btn nav-link continue-link" id="cardContinue" href="wishes.html"><span>Continue</span><i class="arrow"></i></a>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="script.js"></script>
</body>
</html>
