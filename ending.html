<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="ending">

<div id="loader">
  <div class="loader-line"></div>
  <p class="loader-text">Loading</p>
</div>

<nav class="dots" id="navDots" aria-hidden="true"></nav>
<div class="cursor-glow" id="cursorGlow"></div>

<main>
  <section class="scene scene-dark" id="ending">
    <div class="stars"></div>
    <div class="shooting-star" id="endingStar"></div>
    <p class="closing-line serif fade-in" id="closingLine"></p>
    <p class="made-with fade-in">Made with <span class="heart-glyph">♡</span></p>
  </section>
</main>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
